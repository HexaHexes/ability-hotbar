# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_core"
type = "optional"
# alpha.10 of the 1.1.0 line is the floor: it carries each bonus's
# mastery-ability slice (Bonus.masteryBonus, channel v6) - the pane's
# parenthetical reads it, so under it the accessor cannot bind and the
# channel would skew at negotiation (both sides must speak the same
# version; a mismatched version disconnects). alpha.09 adds
# ActivationType.NONE - the pane omits the activation line for a
# passive (a pre-NONE core has no constant to reference) and NONE/
# UNKNOWN rows pass the informational gate (their toggle and cycle
# survive; hotbar's assignment gate owns slotting). alpha.02 carries
# the effect-bonus list itself (REQ-CORE-12 - Entry.bonuses, channel
# v5), the row display's progress field (v4), the 1.0.2 line's query
# exchange, and 1.0.1-alpha.02's slot-scoped mode read (core#133,
# every mode cycle).
versionRange = "[1.1.0-alpha.10,)"
ordering = "AFTER"
side = "BOTH"

# The README's three content rows: Tensura abilities, ISS spell cells and
# Battlewills payloads all ride this bar, each detected through the core
# seam (requiredModId / isLoaded) so absence no-ops the content.
[[dependencies.${mod_id}]]
modId = "tensura"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
type = "optional"
# ISS versions carry the Minecraft prefix (1.21.1-3.16.3), same rule as
# ability-iss' own floor.
versionRange = "[1.21.1-3.16.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_tensura"
type = "optional"
versionRange = "[0.0,)"
# Owner ruling: this mod always loads BEFORE ability_tensura (ability-core ->
# this bar -> ability-tensura/ability-iss), so no ordering edge here - the
# direction is enforced by ability_tensura's own AFTER row. A second AFTER
# edge from this side would be a mutual pair, i.e. a load-order cycle.
ordering = "NONE"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
